<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Reset Password</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body class="bg-light">
        <div class="d-flex align-items-center justify-content-center vh-100">
            <div class="card shadow-sm" style="width: 420px;">
                <div class="card-body">
                    <h4 class="card-title mb-3">Reset Password</h4>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'info' if category=='info' else ('danger' if category=='error' else 'success') }}" role="alert">{{ message|safe }}</div>
                        {% endfor %}
                    {% endwith %}

                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <input class="form-control" type="password" name="password" placeholder="New Password" minlength="8" required>
                        </div>
                        <div class="mb-3">
                            <input class="form-control" type="password" name="confirm_password" placeholder="Confirm Password" minlength="8" required>
                        </div>
                        <div class="d-grid">
                            <button class="btn btn-primary" type="submit">Reset Password</button>
                        </div>
                    </form>
                    <div class="text-center mt-3"><a href="{{ url_for('login') }}">Back to Login</a></div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
