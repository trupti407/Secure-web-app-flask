<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Dashboard</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body class="bg-light">
        <main class="container d-flex align-items-center justify-content-center min-vh-100">
            <div class="w-100" style="max-width:720px;">
                <div class="card card-custom mx-auto">
                    <div class="card-header bg-primary-custom text-white">
                        <h3 class="mb-1">Welcome, {{ user }}</h3>
                        <p class="mb-0 text-white-50">Last sign-in: just now</p>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <div class="p-3 bg-white rounded shadow-sm">
                                <h5 class="mb-1">Account & Quick Actions</h5>
                                <p class="muted-link mb-3">Username: <strong>{{ user }}</strong></p>
                                <div class="d-flex flex-column gap-2">
                                    <a class="btn btn-primary-custom w-100" href="/dashboard">Overview</a>
                                    <a class="btn btn-outline-secondary w-100" href="/logout">Logout</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
